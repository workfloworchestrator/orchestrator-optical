[project]
name = "orchestrator-optical"
version = "0.0.1rc1"
readme = "README.md"
description = "Addon module for Workflow Orchestrator installations that includes product models for optical equipment."
authors = [
    { name = "Consortium GARR" },
    { name = "GÉANT Orchestration and Automation Team", email = "goat@geant.org" }
]
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "orchestrator-core>=5",
    "paramiko>=3.5",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://workfloworchestrator.org"
Documentation = "https://github.com/workfloworchestrator/orchestrator-extra-optical"
Source = "https://github.com/workfloworchestrator/orchestrator-extra-optical"

[dependency-groups]
dev = [
    "pre-commit-uv==4.1.1",
    "pytest==8.4.1",
    "pytest-asyncio==1.0.0",
    "pytest-cov>=6.2.1",
    "pytest-xdist==3.7.0",
    "pytest-env==1.1.5",
    "responses==0.25.7",
    "ruff==0.12.1",
    "testcontainers[postgres]==4.15.0",
    "ty>=0.0.21",
    "types-requests==2.32.4.20250611",
    "types-PyYAML==6.0.12.20241230",
    "pyrefly>=1.1.1",
    "diff-cover>=10.5.0",
]

[build-system]
requires = ["uv_build>=0.10.5,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
prerelease = "if-necessary"
exclude-newer = "30 days"

[tool.uv.build-backend]
# TODO: We want to move to a namespace package, but that depens on upstream changes in orchestrator-core.
# https://github.com/workfloworchestrator/orchestrator-core/issues/1471
module-name = "orchestrator.optical"
namespace = false
source-include = [
    "orchestrator/optical/migrations/alembic.ini",
    "orchestrator/optical/migrations/versions/**",
]

[tool.ty.src]
exclude = [
    "docs",
    # Test suite and dev tooling are behavior-verified by pytest / run manually, not type-gated.
    "test",
    "scripts",
    "src/orchestrator/optical/services",
    # Pre-existing ty diagnostics in the form/selector helpers (see AGENTS.md).
    "src/orchestrator/optical/workflows/shared.py"
]

[tool.ty.rules]
call-non-callable = "ignore"
invalid-type-form = "ignore"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"

[tool.ruff]
exclude = [
    "venv",
    ".venv",
    # Auto-generated Nokia YANG models/navigators; never hand-edit (see AGENTS.md).
    "src/orchestrator/optical/services/nokia/g30/data_models",
    "src/orchestrator/optical/services/nokia/g30/data_navigators",
    "src/orchestrator/optical/services/nokia/g42/data_models",
    "src/orchestrator/optical/services/nokia/g42/data_navigators",
]
line-length = 120
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
ignore = [
    "B901",
    "C901",
    "COM812",
    "D203",
    "D213",
    "ISC001",
    "N805",
    "PLC2801",
    "PLR0913",
    "PLR0904",
    "PLW1514",
    "FURB118",
    "S311",
]
select = [
    "A",
    "ARG",
    "B",
    "BLE",
    "C",
    "COM",
    "C4",
    "C90",
    "D",
    "DTZ",
    "E",
    "EM",
    "ERA",
    "F",
    "FA",
    "FBT",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "R",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "T",
    "T20",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Developer CLI scripts report their results on stdout/stderr.
"scripts/**" = ["T201"]
"orchestrator/optical/workflows/*" = ["PLR0917", "PLR0914"]
"test/**" = ["ARG001", "D", "S101", "PLR2004", "PLR0917", "PLR0914", "PLC0415", "PLC2701"]
# Ported vendor driver / integration code (Nokia FlexILS/G30/G42/TNMS): excluded from the
# type checkers and its docstrings are not maintained, so do not require them here.
"src/orchestrator/optical/services/**" = ["D"]
# TL1 command modules are derived from device help text (see
# services/nokia/flexils/utils/tl1_command_help_to_pydantic_generator.py): long help_text literals
# and the response parser's branch/statement count are inherent to the generated definitions.
"src/orchestrator/optical/services/nokia/flexils/commands/*" = ["E501", "PLR0912", "PLR0915"]
# Manual, run-once developer helper that prints the generated class to stdout.
"src/orchestrator/optical/services/nokia/flexils/utils/tl1_command_help_to_pydantic_generator.py" = ["E501", "T201"]
# Endpoints deliberately call the client's package-internal `_request` helper.
"src/orchestrator/optical/services/nokia/tnms/endpoints.py" = ["SLF001"]
# Alembic-generated revision files (do not hand-edit).
"src/orchestrator/optical/migrations/**" = ["D", "INP001"]
# Maintainer-owned product model: leave the location-code length literal untouched.
"src/orchestrator/optical/products/product_blocks/optical_location.py" = ["PLR2004"]
# Domain validator is intentionally one long, linear validation routine.
"src/orchestrator/optical/utils/custom_types/dns.py" = ["PLR0912"]

[tool.ruff.lint.isort]
known-third-party = ["pydantic", "migrations"]
known-first-party = ["test", "docs"]

[tool.pytest.ini_options]
addopts = "-m 'not db'"
markers = ["noautofixt", "db", "contract", "unit"]
filterwarnings = [
    # Third-party deprecations only. These are raised inside orchestrator-core 5.1.3 and its
    # dependencies, not by orchestrator.optical; revisit/remove on core upgrades.
    # pydantic: orchestrator-core's FixedInputBaseSchema still sets the removed-in-V3 json_encoders.
    "ignore:`json_encoders` is deprecated:DeprecationWarning:pydantic\\._internal\\._generate_schema",
    # orchestrator-core: legacy scheduler registry imported by the API endpoints.
    "ignore:ALL_SCHEDULERS is deprecated:DeprecationWarning:orchestrator\\.core\\.api\\.api_v1\\.endpoints\\.schedules",
    # alembic: version_locations in the migration configs lacks the newer path_separator setting.
    "ignore:No path_separator found in configuration:DeprecationWarning:alembic\\.config",
]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["test"]

[tool.pytest_env]
TRANSLATIONS_DIR = "orchestrator/optical/translations"

[tool.coverage.run]
branch = true
omit = [
    "*/services/nokia/g30/data_models/*",
    "*/services/nokia/g30/data_navigators/*",
    "*/services/nokia/g42/data_models/*",
    "*/services/nokia/g42/data_navigators/*",
    "*/optical/migrations/*",
]
source = ["orchestrator.optical"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "if __name__ == \"__main__\":",
]

[tool.pyrefly]
search-path = ["src"]
python-interpreter-path = ".venv/bin/python"
project-excludes = [
    # Test suite and dev tooling are behavior-verified by pytest / run manually, not type-gated.
    "test/**",
    "scripts/**",
    "src/orchestrator/optical/services/**",
    # Pre-existing diagnostics in the form/selector helpers (see AGENTS.md).
    "src/orchestrator/optical/workflows/shared.py",
]

[[tool.pyrefly.sub-config]]
matches = "src/orchestrator/optical/products/**"   # or "subdir/**", "**/legacy/**", etc.
[tool.pyrefly.sub-config.errors]
bad-override-mutable-attribute = false
